name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and package build
        run: npm test

      - name: Schema and pack integrity
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Require the tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/open-tax/package.json').version")"
          if [ "$RELEASE_TAG" != "v${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match packages/open-tax version ${VERSION}. Push v${VERSION} to release." >&2
            exit 1
          fi
          echo "Releasing open-tax ${VERSION}"

      - name: Pack the npm tarball
        run: |
          set -euo pipefail
          cd packages/open-tax
          npm pack | tee /tmp/npm-pack.txt
          TARBALL="$(grep -E '^open-tax-.*\.tgz$' /tmp/npm-pack.txt | tail -n 1)"
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "npm pack did not produce a tarball." >&2
            exit 1
          fi
          SHA="$(sha256sum "$TARBALL" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$TARBALL" > SHA256SUMS
          echo "Packed ${TARBALL}"
          echo "sha256 ${SHA}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              packages/open-tax/open-tax-*.tgz \
              packages/open-tax/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              packages/open-tax/open-tax-*.tgz \
              packages/open-tax/SHA256SUMS
          fi

      - name: Publish to npm when NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured. Skipping npm publish."
            exit 0
          fi
          VERSION="$(node -p "require('./packages/open-tax/package.json').version")"
          if npm view "open-tax@${VERSION}" version >/dev/null 2>&1; then
            echo "open-tax@${VERSION} is already on npm. Skipping npm publish."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
          npm publish -w open-tax --access public
